name: Release Build & Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      track:
        description: 'Play Store track'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

env:
  JAVA_VERSION: '17'

jobs:
  build:
    name: Build Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode Keystore
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          echo "$SIGNING_KEY_BASE64" | base64 -d > app/deepeye-release.keystore

      - name: Build Release AAB
        env:
          DEEPEYE_RELEASE_STORE_FILE: app/deepeye-release.keystore
          DEEPEYE_RELEASE_STORE_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          DEEPEYE_RELEASE_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          DEEPEYE_RELEASE_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_ALIAS_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease \
            -PDEEPEYE_RELEASE_STORE_FILE=$DEEPEYE_RELEASE_STORE_FILE \
            -PDEEPEYE_RELEASE_STORE_PASSWORD=$DEEPEYE_RELEASE_STORE_PASSWORD \
            -PDEEPEYE_RELEASE_KEY_ALIAS=$DEEPEYE_RELEASE_KEY_ALIAS \
            -PDEEPEYE_RELEASE_KEY_PASSWORD=$DEEPEYE_RELEASE_KEY_PASSWORD

      - name: Build Release APK
        env:
          DEEPEYE_RELEASE_STORE_FILE: app/deepeye-release.keystore
          DEEPEYE_RELEASE_STORE_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          DEEPEYE_RELEASE_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          DEEPEYE_RELEASE_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_ALIAS_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PDEEPEYE_RELEASE_STORE_FILE=$DEEPEYE_RELEASE_STORE_FILE \
            -PDEEPEYE_RELEASE_STORE_PASSWORD=$DEEPEYE_RELEASE_STORE_PASSWORD \
            -PDEEPEYE_RELEASE_KEY_ALIAS=$DEEPEYE_RELEASE_KEY_ALIAS \
            -PDEEPEYE_RELEASE_KEY_PASSWORD=$DEEPEYE_RELEASE_KEY_PASSWORD

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload ProGuard Mapping
        uses: actions/upload-artifact@v4
        with:
          name: proguard-mapping
          path: app/build/outputs/mapping/release/mapping.txt

      - name: Upload Native Debug Symbols
        uses: actions/upload-artifact@v4
        with:
          name: native-debug-symbols
          path: app/build/intermediates/merged_native_libs/release/

      - name: Cleanup Keystore
        if: always()
        run: rm -f app/deepeye-release.keystore

  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: artifacts/

      - name: Download AAB
        uses: actions/download-artifact@v4
        with:
          name: release-aab
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/app-release.apk
            artifacts/app-release.aab
          generate_release_notes: true
          draft: true

  deploy-play-store:
    name: Deploy to Play Store
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download AAB
        uses: actions/download-artifact@v4
        with:
          name: release-aab
          path: artifacts/

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install Fastlane
        run: gem install fastlane

      - name: Decode Service Account Key
        env:
          PLAY_STORE_JSON_KEY_BASE64: ${{ secrets.PLAY_STORE_JSON_KEY_BASE64 }}
        run: |
          echo "$PLAY_STORE_JSON_KEY_BASE64" | base64 -d > play-store-key.json

      - name: Deploy to Play Store
        env:
          SUPPLY_JSON_KEY: play-store-key.json
          SUPPLY_PACKAGE_NAME: com.deepeye.musicpro
        run: |
          TRACK="${{ github.event.inputs.track }}"
          fastlane supply \
            --aab artifacts/app-release.aab \
            --track "$TRACK" \
            --release_status "draft" \
            --json_key play-store-key.json \
            --package_name com.deepeye.musicpro

      - name: Cleanup Key
        if: always()
        run: rm -f play-store-key.json
