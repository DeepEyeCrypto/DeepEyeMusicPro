plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

android {
    namespace 'com.deepeye.musicpro'
    compileSdk 35

    defaultConfig {
        applicationId 'com.deepeye.musicpro'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        buildConfigField 'boolean', 'ENABLE_DSP', 'true'
        buildConfigField 'boolean', 'ENABLE_ADBLOCK', 'true'
        buildConfigField 'boolean', 'ENABLE_DOWNLOADS', 'true'
        buildConfigField 'boolean', 'DEBUG_AUDIO', 'false'

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-O3 -ffast-math -fno-exceptions -fno-rtti -Wall -Wextra'
                cFlags '-O3 -ffast-math -Wall -Wextra'
                arguments '-DANDROID_STL=c++_shared'
            }
        }

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += [
                    'room.schemaLocation': "$projectDir/schemas".toString(),
                    'room.incremental': 'true',
                    'room.expandProjection': 'true'
                ]
            }
        }
    }

    signingConfigs {
        release {
            def storePath = providers.gradleProperty('DEEPEYE_RELEASE_STORE_FILE').orNull
            if (storePath != null && file(storePath).exists()) {
                storeFile file(storePath)
                storePassword providers.gradleProperty('DEEPEYE_RELEASE_STORE_PASSWORD').orNull
                keyAlias providers.gradleProperty('DEEPEYE_RELEASE_KEY_ALIAS').orNull
                keyPassword providers.gradleProperty('DEEPEYE_RELEASE_KEY_PASSWORD').orNull
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            jniDebuggable true
            buildConfigField 'boolean', 'DEBUG_AUDIO', 'true'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release.storeFile != null ? signingConfigs.release : signingConfigs.debug
            ndk {
                debugSymbolLevel 'FULL'
            }
            firebaseCrashlytics {
                nativeSymbolUploadEnabled true
                unstrippedNativeLibsDir 'build/intermediates/cxx/Release'
            }
        }
    }

    bundle {
        language { enableSplit = true }
        density { enableSplit = true }
        abi { enableSplit = true }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += [
            '-Xjvm-default=all',
            '-opt-in=kotlinx.coroutines.ExperimentalCoroutinesApi'
        ]
    }

    buildFeatures {
        buildConfig true
        viewBinding true
        dataBinding true
        prefab true
        compose true
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    packaging {
        resources {
            excludes += [
                'META-INF/AL2.0',
                'META-INF/LGPL2.1',
                'META-INF/LICENSE*',
                'META-INF/NOTICE*',
                'META-INF/DEPENDENCIES',
                'META-INF/*.kotlin_module'
            ]
        }
    }
}

kapt {
    correctErrorTypes true
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.fragment:fragment-ktx:1.8.5'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-service:2.8.7'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.8.4'
    implementation 'androidx.navigation:navigation-ui-ktx:2.8.4'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.datastore:datastore-preferences:1.1.1'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    implementation 'androidx.media:media:1.7.0'

    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.airbnb.android:lottie:6.6.2'
    implementation 'io.coil-kt:coil:2.7.0'

    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.4.1'
    implementation 'androidx.media3:media3-session:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'androidx.media3:media3-datasource-okhttp:1.4.1'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:okhttp-dnsoverhttps:4.12.0'
    implementation 'org.json:json:20240303'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.9.0'

    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'

    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.0'

    // YouTube Auth & Security
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
    implementation 'androidx.credentials:credentials:1.2.2'
    implementation 'androidx.credentials:credentials-play-services-auth:1.2.2'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // UI Enhancements
    implementation 'com.facebook.shimmer:shimmer:0.5.0'

    // Google Cast & Media Routing
    implementation 'com.google.android.gms:play-services-cast-framework:21.5.0'
    implementation 'androidx.mediarouter:mediarouter:1.7.0'

    // Low Latency Audio
    implementation 'com.google.oboe:oboe:1.9.0'

    // Jetpack Compose
    def composeBom = platform('androidx.compose:compose-bom:2024.10.00')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose'
    implementation 'androidx.activity:activity-compose'

    // Baseline Profile (AOT compilation at install time)
    implementation 'androidx.profileinstaller:profileinstaller:1.4.1'

    // Firebase (Crashlytics + Analytics)
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-crashlytics-ndk'
    implementation 'com.google.firebase:firebase-analytics'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}



apply plugin: 'com.google.gms.google-services'
